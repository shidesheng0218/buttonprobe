name: Eval

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run eval:viral
      - run: npm run eval:react
