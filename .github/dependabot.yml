version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - "@types/*"
          - "typescript"
          - "tsx"
          - "vitest"
          - "vite"
      playwright:
        patterns:
          - "playwright"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
