name: ButtonProbe PR Proof

on:
  pull_request:

jobs:
  verify-ui-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run dev -- --host 127.0.0.1 --port 5173 &
      - run: npx wait-on http://127.0.0.1:5173
      - name: Verify PR diff with browser proof
        run: |
          npx buttonprobe verify http://127.0.0.1:5173 \
            --patch-url "${{ github.event.pull_request.diff_url }}" \
            --test-command "npm test" \
            --dev-command "npm run dev -- --host 127.0.0.1 --port {port}" \
            --output buttonprobe-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buttonprobe-proof
          path: buttonprobe-proof
